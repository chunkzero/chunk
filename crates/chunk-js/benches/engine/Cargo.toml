[package]
name = "chunk-js-engine-bench"
version = "0.0.0"
edition = "2024"
publish = false

# This experiment does not add Deno or V8 to the production workspace.
[workspace]

[dependencies]
chunk-js-baseline = { path = "generated-baseline" }
deno_core = "=0.411.0"
serde_json = "1"
rustix = { version = "1", features = ["time"] }

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
