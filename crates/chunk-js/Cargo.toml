[package]
name = "chunk-js"
description = "Minimal embedded JavaScript execution for the environment sync engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
deno_core = "0.411.0"
deno_error = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync"] }

[lints]
workspace = true
