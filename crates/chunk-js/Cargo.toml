[package]
name = "chunk-js"
description = "Minimal embedded JavaScript execution for the environment sync engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chunk-contract = { path = "../chunk-contract" }
deno_core = "0.411.0"
deno_error = "0.7.1"
deno_web = "0.289.0"
deno_webidl = "0.258.0"
sha2 = "0.10"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
