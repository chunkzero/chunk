[package]
name = "chunk-backend"
description = "Environment engine thread and ordered durable commit pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
chunk-service = { path = "../chunk-service" }
chunk-contract = { path = "../chunk-contract" }
chunk-proto = { path = "../chunk-proto" }
chunk-js = { path = "../chunk-js" }
chunk-store = { path = "../chunk-store" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }

[dev-dependencies]
chunk-build = { path = "../chunk-build" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
