[package]
name = "chunk-backend"
description = "Authoritative environment transactions and reactive queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chunk-contract = { path = "../chunk-contract" }
chunk-js = { path = "../chunk-js" }
chunk-store = { path = "../chunk-store" }
chunk-proto = { path = "../chunk-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
