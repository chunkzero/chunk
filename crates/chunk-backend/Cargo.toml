[package]
name = "chunk-backend"
description = "Environment engine thread and ordered durable commit pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Exposes engine and commit phase timings to local benchmarks.
bench-support = []

[dependencies]
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
chunk-service = { path = "../chunk-service" }
chunk-contract = { path = "../chunk-contract" }
chunk-js = { path = "../chunk-js" }
chunk-store = { path = "../chunk-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
chunk-build = { path = "../chunk-build" }
rusqlite = "0.40.2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
