[package]
name = "chunk-store"
description = "Environment persistence, database adapters and log replication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chunk-contract = { path = "../chunk-contract" }
crc32fast = "1"
futures-util = "0.3"
object_store = { version = "0.12", default-features = false, features = ["aws"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint", "session"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
