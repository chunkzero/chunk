[package]
name = "chunk-assets"
description = "Immutable deployment objects over local or S3-compatible storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
s3 = ["object_store/aws"]

[dependencies]
bytes = "1"
object_store = { version = "0.14", default-features = false, features = ["fs"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
