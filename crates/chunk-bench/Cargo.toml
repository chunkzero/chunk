[package]
name = "chunk-bench"
description = "Opt-in proxy, control and backend workload benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
chunk-backend = { path = "../chunk-backend", features = ["bench-support"] }
chunk-build = { path = "../chunk-build" }
chunk-contract = { path = "../chunk-contract" }
chunk-control = { path = "../chunk-control" }
chunk-environment = { path = "../chunk-environment" }
chunk-proto = { path = "../chunk-proto" }
chunk-proxy = { path = "../chunk-proxy", features = ["bench-support"] }
chunk-store = { path = "../chunk-store" }
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false, features = ["serialization"] }
prost = "0.14.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "io-std",
  "process",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
