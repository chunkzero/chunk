[package]
name = "chunk"
description = "The chunk command: toolchain and platform processes in one binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-1"]
mc-26-1 = ["chunk-edge/mc-26-1"]

[[bin]]
name = "chunk"
path = "src/main.rs"

[dependencies]
chunk-build = { path = "../chunk-build" }
chunk-control = { path = "../chunk-control" }
chunk-edge = { path = "../chunk-edge", default-features = false }
chunk-runtime = { path = "../chunk-runtime" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
