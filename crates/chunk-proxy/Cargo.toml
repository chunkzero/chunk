[package]
name = "chunk-proxy"
description = "Minecraft TCP listener with status responses and authenticated login"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-2"]
bench-support = ["mc-26-2"]
test-support = ["mc-26-2"]
mc-26-2 = [
  "chunk-protocol/mc-26-2",
  "dep:chunk-service",
  "dep:openssl",
  "dep:reqwest",
  "dep:serde",
  "dep:libdeflater",
  "dep:zeroize",
]

[dependencies]
tokio-util = { version = "0.7", features = ["io", "rt"] }
chunk-contract = { path = "../chunk-contract" }
chunk-service = { path = "../chunk-service", optional = true }
tonic = "0.14.6"
prost = "0.14.4"
uuid = { version = "1", features = ["v4"] }
chunk-protocol = { path = "../chunk-protocol", default-features = false }
chunk-proto = { path = "../chunk-proto" }
bytes = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"], optional = true }
openssl = { version = "0.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
libdeflater = { version = "1", optional = true }
zeroize = { version = "1", optional = true }
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "sync", "time"] }
tracing = "0.1"
ipnet = "2"

[dev-dependencies]
chunk-backend = { path = "../chunk-backend" }
chunk-store = { path = "../chunk-store" }
chunk-js = { path = "../chunk-js" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
