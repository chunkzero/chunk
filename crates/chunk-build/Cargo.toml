[package]
name = "chunk-build"
description = "Application bundling, code generation, JAR and asset build orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nodejs-built-in-modules = "1"
rolldown = "=1.2.8"
rolldown_common = "=1.2.8"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chunk-contract = { path = "../chunk-contract" }
chunk-js = { path = "../chunk-js" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
