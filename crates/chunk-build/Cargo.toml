[package]
name = "chunk-build"
description = "Application bundling, code generation, JAR and asset build orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["compiler"]
# Project inspection, app compilation and bundling, SDK generation and release publishing.
compiler = [
  "dep:anyhow",
  "dep:nodejs-built-in-modules",
  "dep:oxc_allocator",
  "dep:oxc_ast",
  "dep:oxc_parser",
  "dep:oxc_span",
  "dep:rolldown",
  "dep:rolldown_common",
  "dep:sha1",
  "dep:tokio",
  "dep:chunk-js",
  "dep:toml",
]

[[bin]]
name = "chunk-compile"
required-features = ["compiler"]

[dependencies]
nodejs-built-in-modules = { version = "1", optional = true }
oxc_allocator = { version = "=0.149.0", optional = true }
oxc_ast = { version = "=0.149.0", optional = true }
oxc_parser = { version = "=0.149.0", optional = true }
oxc_span = { version = "=0.149.0", optional = true }
rolldown = { version = "=1.2.8", optional = true }
rolldown_common = { version = "=1.2.8", optional = true }
anyhow = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
chunk-contract = { path = "../chunk-contract" }
chunk-js = { path = "../chunk-js", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
