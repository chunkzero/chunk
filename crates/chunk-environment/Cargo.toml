[package]
name = "chunk-environment"
description = "Environment process running the core, gateway and exec services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-2"]
mc-26-2 = ["chunk-proxy/mc-26-2"]

[dependencies]
chunk-backend = { path = "../chunk-backend" }
chunk-build = { path = "../chunk-build", default-features = false }
chunk-contract = { path = "../chunk-contract" }
chunk-control = { path = "../chunk-control" }
chunk-js = { path = "../chunk-js" }
chunk-management = { path = "../chunk-management" }
chunk-proto = { path = "../chunk-proto" }
chunk-proxy = { path = "../chunk-proxy", default-features = false }
chunk-service = { path = "../chunk-service" }
chunk-store = { path = "../chunk-store" }
prost = "0.14.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.14.6"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bytes = "1"
chunk-build = { path = "../chunk-build" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
