[package]
name = "chunk-environment"
description = "Environment process running the core, gateway and exec services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-2"]
mc-26-2 = ["chunk-proxy/mc-26-2"]

[dependencies]
chunk-backend = { path = "../chunk-backend" }
chunk-contract = { path = "../chunk-contract" }
chunk-control = { path = "../chunk-control" }
chunk-js = { path = "../chunk-js" }
chunk-proto = { path = "../chunk-proto" }
chunk-proxy = { path = "../chunk-proxy", default-features = false }
chunk-service = { path = "../chunk-service" }
chunk-store = { path = "../chunk-store" }
prost = "0.14.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.14.6"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
