[package]
name = "chunk-edge"
description = "Edge that routes players' Minecraft connections by hostname to environment gateways"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1"
chunk-management = { path = "../chunk-management" }
chunk-protocol = { path = "../chunk-protocol", default-features = false }
chunk-service = { path = "../chunk-service" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14.4"
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
tokio-stream = "0.1"

[lints]
workspace = true
