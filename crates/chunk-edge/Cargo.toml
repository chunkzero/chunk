[package]
name = "chunk-edge"
description = "Proxy entry point and environment backend integration scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-2"]
mc-26-2 = ["chunk-proxy/mc-26-2"]

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
chunk-service = { path = "../chunk-service" }
chunk-proxy = { path = "../chunk-proxy", default-features = false }

[lints]
workspace = true
