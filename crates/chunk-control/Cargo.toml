[package]
name = "chunk-control"
description = "Control plane: directory, placement and provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
chunk-backend = { path = "../chunk-backend" }
chunk-service = { path = "../chunk-service" }
chunk-contract = { path = "../chunk-contract" }
chunk-proto = { path = "../chunk-proto" }
chunk-store = { path = "../chunk-store" }
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
tonic = "0.14.6"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
command-fds = { version = "0.3", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
