[package]
name = "chunk-control"
description = "Control plane: directory, placement and provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chunk-contract = { path = "../chunk-contract" }
chunk-proto = { path = "../chunk-proto" }
chunk-runtime = { path = "../chunk-runtime" }
chunk-store = { path = "../chunk-store" }
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "sync", "time"] }
tonic = "0.14.6"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
