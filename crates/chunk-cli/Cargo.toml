[package]
name = "chunk-cli"
description = "Developer CLI for application builds, platform operations and local development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-1"]
mc-26-1 = ["chunk-edge/mc-26-1"]

[[bin]]
name = "chunk"
path = "src/main.rs"

[dependencies]
chunk-service = { path = "../chunk-service" }
chunk-backend = { path = "../chunk-backend" }
chunk-contract = { path = "../chunk-contract" }
chunk-build = { path = "../chunk-build" }
chunk-control = { path = "../chunk-control" }
chunk-edge = { path = "../chunk-edge", default-features = false }
chunk-proto = { path = "../chunk-proto" }
clap = { version = "4", features = ["derive", "env"] }
url = { version = "2", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
process-wrap = { version = "10", default-features = false, features = [
  "tokio1",
  "process-group",
  "job-object",
  "kill-on-drop",
] }
tokio-util = "0.7"
tonic = "0.14.6"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tempfile = "3"
cliclack = "0.5.6"

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
