[package]
name = "chunk-cli"
description = "Developer CLI for application builds, platform operations and local development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-1"]
mc-26-1 = ["chunk-edge/mc-26-1"]

[[bin]]
name = "chunk"
path = "src/main.rs"

[dependencies]
chunk-service = { path = "../chunk-service" }
chunk-backend = { path = "../chunk-backend" }
chunk-contract = { path = "../chunk-contract" }
chunk-build = { path = "../chunk-build" }
chunk-control = { path = "../chunk-control" }
chunk-edge = { path = "../chunk-edge", default-features = false }
chunk-runtime = { path = "../chunk-runtime" }
chunk-proto = { path = "../chunk-proto" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
tonic = "0.14.6"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
