[package]
name = "chunk-cli"
description = "Developer CLI for application builds, platform operations and local development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["mc-26-2"]
mc-26-2 = ["chunk-environment/mc-26-2"]

[[bin]]
name = "chunk"
path = "src/main.rs"

[dependencies]
chunk-service = { path = "../chunk-service" }
chunk-backend = { path = "../chunk-backend" }
chunk-contract = { path = "../chunk-contract" }
chunk-build = { path = "../chunk-build" }
chunk-control = { path = "../chunk-control" }
chunk-environment = { path = "../chunk-environment", default-features = false }
chunk-management = { path = "../chunk-management" }
chunk-proto = { path = "../chunk-proto" }
clap = { version = "4", features = ["derive", "env"] }
url = { version = "2", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "process",
  "time",
  "io-util",
  "sync",
  "net",
  "fs",
] }
process-wrap = { version = "10", default-features = false, features = [
  "tokio1",
  "process-group",
  "job-object",
  "kill-on-drop",
] }
tokio-util = "0.7"
tonic = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
cliclack = "0.5.6"
notify = "8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
keyring-core = { version = "1", features = ["sample"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
