name: SDK distribution

on:
  pull_request:
    # Drafts skip CI; run the checks locally while iterating. Marking a PR ready runs them here.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/sdk.yml
      - .github/actions/rust-cache/**
      - scripts/package-sdk.py
      - scripts/check-sdk.py
      - scripts/install.sh
      - scripts/install-typescript.mjs
      - scripts/rust-notices.py
      - scripts/publish-maven.py
      - scripts/test-publish-maven.py
      - buildSrc/**
      - build.gradle.kts
      - crates/**
      - jvm/**/build.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - Cargo.toml
      - Cargo.lock
      - licenses/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this SDK version publicly to Maven and GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  GRADLE_OPTS: -Dorg.gradle.workers.max=2

jobs:
  package:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact-id: ${{ steps.sdk.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
      - name: Read coordinated SDK version
        id: version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['workspace']['package']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\n')
          PY
      - run: rustup toolchain install --no-self-update
      - uses: ./.github/actions/rust-cache
        with:
          profile: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
      - run: python3 scripts/test-publish-maven.py
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --locked -p chunk-cli
      - run: python3 scripts/package-sdk.py --output dist
      - uses: actions/upload-artifact@v4
        id: sdk
        with:
          name: chunk-sdk-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/maven/**
            scripts/install.sh
          if-no-files-found: error
          # Cleanup deletes it once used; retention only bounds runs that never reach cleanup.
          retention-days: 1

  verify:
    needs: package
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Install consumer prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git python3
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-sdk.py
            /scripts/check-consumers.py
            /scripts/install.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: chunk-sdk-linux-x64
          path: artifact
      - name: Verify installed SDK without build-machine sources or caches
        env:
          SDK_VERSION: ${{ needs.package.outputs.version }}
        run: python3 scripts/check-sdk.py "artifact/dist/chunk-$SDK_VERSION-linux-x64.tar.gz" artifact/dist/maven

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [package, verify]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: sdk-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: chunk-sdk-linux-x64
          path: artifact
      - uses: chunkzero/maven-r2@v1
        with:
          version: v0.1.0
      - name: Prepare draft release and publish matching Maven artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ needs.package.outputs.version }}
          MAVEN_R2_SERVER: https://maven.chunkzero.com
          MAVEN_R2_TOKEN: ${{ secrets.MAVEN_R2_TOKEN }}
        run: |
          : "${MAVEN_R2_TOKEN:?Set the Maven R2 publishing token secret}"
          name="chunk-$SDK_VERSION-linux-x64"
          archive="artifact/dist/$name.tar.gz"
          (cd artifact/dist && sha256sum --check "$name.tar.gz.sha256")
          git fetch --tags --quiet origin
          tag_commit=$(git rev-parse --verify --quiet "refs/tags/v$SDK_VERSION^{commit}" || true)
          if [ -n "$tag_commit" ]; then test "$tag_commit" = "$GITHUB_SHA"; fi
          if gh release view "v$SDK_VERSION" --json isDraft,targetCommitish > release-state.json; then
            python3 - <<'PYTHON'
          import json, os
          with open('release-state.json') as source:
              release = json.load(source)
          assert release['isDraft'] and release['targetCommitish'] == os.environ['GITHUB_SHA'], 'Release version already belongs to another commit or is public'
          PYTHON
          else
            gh release create "v$SDK_VERSION" --draft --target "$GITHUB_SHA" --title "Chunk $SDK_VERSION" --generate-notes
          fi
          gh release upload "v$SDK_VERSION" "$archive" "$archive.sha256" artifact/scripts/install.sh --clobber
          maven-r2 publish --repository default/releases -- \
            python3 scripts/publish-maven.py artifact/dist/maven "$SDK_VERSION"
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            "https://maven.chunkzero.com/com/chunkzero/chunk/runtime/$SDK_VERSION/runtime-$SDK_VERSION.pom" \
            -o published.pom
          cmp published.pom "artifact/dist/maven/com/chunkzero/chunk/runtime/$SDK_VERSION/runtime-$SDK_VERSION.pom"
          if [[ "$SDK_VERSION" == *-* ]]; then
            gh release edit "v$SDK_VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "v$SDK_VERSION" --draft=false --prerelease=false --latest
          fi

  # The artifact only hands the SDK between jobs; keeping it counts against Actions storage.
  cleanup:
    if: always() && needs.package.outputs.artifact-id != ''
    needs: [package, verify, publish]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the SDK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
