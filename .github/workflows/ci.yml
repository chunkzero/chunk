name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Drafts skip CI; run the checks locally, or mark the PR ready and push to run them here.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Install the pinned Rust formatter
        run: rustup component add rustfmt
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: just fmt-check

  rust:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: ./.github/actions/rust-cache
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-typescript.mjs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p chunk-proxy --no-default-features

  jvm:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain before parallel Gradle tasks
        run: rustup toolchain install --no-self-update
      - uses: ./.github/actions/rust-cache
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-typescript.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
      - run: cargo build -p chunk-cli
      - run: ./gradlew build
      - run: examples/local/gradlew build --no-daemon
      - run: python3 scripts/check-consumers.py target/debug/chunk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jvm-test-results
          path: jvm/**/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  proto:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          push: false
          pr_comment: false

  typescript:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
