name: Cache Rust and V8
description: Preserve Cargo dependencies and V8's native archive across CI jobs.
inputs:
  profile:
    description: Cargo output profile directory (debug or release)
    default: debug
  key:
    description: Separates the caches of jobs that share a runner OS and architecture, such as a build matrix
    default: ""
runs:
  using: composite
  steps:
    # Follows Cargo's CARGO_TARGET_DIR and CARGO_BUILD_TARGET, so set them before this action.
    - id: paths
      shell: bash
      run: |
        target="${CARGO_TARGET_DIR:-target}"
        profile="$target/${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}${{ inputs.profile }}"
        echo "target=$target" >> "$GITHUB_OUTPUT"
        echo "gn-out=$profile/gn_out" >> "$GITHUB_OUTPUT"
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.key }}
        workspaces: . -> ${{ steps.paths.outputs.target }}
    # rust-cache removes gn_out during cleanup; this later action saves it first.
    - uses: actions/cache@v5
      id: v8
      with:
        path: ${{ steps.paths.outputs.gn-out }}
        key: >-
          v8-${{ inputs.key || format('{0}-{1}', runner.os, runner.arch) }}-${{ inputs.profile }}-${{
          hashFiles('Cargo.lock') }}
    - name: Rebuild V8 if its native archive was evicted
      if: steps.v8.outputs.cache-hit != 'true'
      shell: bash
      run: cargo clean -p v8 --profile ${{ inputs.profile == 'debug' && 'dev' || inputs.profile }}
