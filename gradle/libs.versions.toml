[versions]
chunk = "0.1.0"
kotlin = "2.4.10"
junit = "6.1.3"
kotest = "6.2.4"
shadow = "9.6.1"
foojay = "1.0.0"
dokka = "2.2.0"

protobuf = "4.36.1"
grpc = "1.84.0"
minestom = "2026.05.17c-26.1.1"

[libraries]
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.0.2-1" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
jackson = { module = "tools.jackson.core:jackson-databind", version = "3.2.2" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.18" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

# Exposed so buildSrc can apply the Kotlin plugin from the catalog.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
asm = { module = "org.ow2.asm:asm", version = "9.10.1" }

[plugins]
protobuf = { id = "com.google.protobuf", version = "0.10.0" }
kotlin-sam-receiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
