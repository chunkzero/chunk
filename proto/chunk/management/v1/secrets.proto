syntax = "proto3";

package chunk.management.v1;

import "google/protobuf/timestamp.proto";

// Secrets per environment, for the CLI and dashboards. Values are write-only:
// no RPC in this service returns them. Environments receive them through
// EnvironmentService.Attach.
service SecretService {
  // Creates or replaces a secret. Each change is a new version, and attached
  // environments receive it without a redeploy, which is how secrets rotate.
  // Idempotent by request_id.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // Lists secret names and versions.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Deletes a secret; attached environments stop receiving it. Idempotent.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message Secret {
  string environment_id = 1;
  // Unique within the environment; matches `[A-Za-z_][A-Za-z0-9_]{0,127}`.
  string name = 2;
  uint64 version = 3;
  google.protobuf.Timestamp update_time = 4;
}

message SetSecretRequest {
  string request_id = 1;
  string environment_id = 2;
  string name = 3;
  bytes value = 4;
}

message SetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {
  string environment_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  string next_page_token = 2;
}

message DeleteSecretRequest {
  string environment_id = 1;
  string name = 2;
}

message DeleteSecretResponse {}
