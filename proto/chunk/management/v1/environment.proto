syntax = "proto3";

package chunk.management.v1;

import "chunk/management/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Called by an environment's own processes with that environment's token; the
// token decides which environment each call concerns. Environments never hold
// provider credentials: they ask this service for capacity and it drives the
// provider.
service EnvironmentService {
  // Registers one environment process and streams the environment's desired
  // state. The first message is sent at once and later ones follow every
  // change. Each message is complete and replaces the previous one, so a
  // process that reconnects applies the latest message and carries on. The
  // server may resend an unchanged revision as a keepalive.
  //
  // Every accepted core attach gets a new lease, higher than any before it
  // for the environment, and makes that core the owner. ReportStatus,
  // SetWakeAlarm, EnsureCapacity and ReleaseCapacity carry the lease, and any
  // call with a lower lease fails with FAILED_PRECONDITION. A core attach is
  // refused with FAILED_PRECONDITION when its epoch is lower than the
  // environment's, or when its instance_id was superseded by another core's
  // attach; superseded instance IDs never become owner again. The previous
  // owner's stream ends with FAILED_PRECONDITION. A core that receives it
  // must stop serving.
  rpc Attach(AttachRequest) returns (stream AttachResponse);
  // Reports what the environment serves: ready gateways, players, deployment
  // progress and the server-list statuses edges cache while it sleeps. Called
  // by core periodically, on change, and before suspending. Fenced by lease.
  // Under one lease, a report whose sequence is not greater than the last
  // accepted one is ignored. Wall-clock time never orders reports.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  // Hands off the backend's next due job so the management plane can wake a
  // suspended environment for it. An alarm is identified by (epoch,
  // generation), ordered by epoch and then generation, so the first alarm
  // after a restore replaces any alarm from before it even when its
  // generation is lower. A higher pair replaces the stored alarm; a lower
  // pair is ignored; the stored pair with the same due time is a no-op; the
  // stored pair with a different due time fails with FAILED_PRECONDITION.
  // The response echoes the alarm that is stored. Acknowledge the handoff
  // locally only when all three echoed fields equal the request. Fenced by
  // lease.
  rpc SetWakeAlarm(SetWakeAlarmRequest) returns (SetWakeAlarmResponse);
  // Asks for one machine of a named machine profile. Durable and idempotent
  // by request_id: the first call records the intent and may return while the
  // machine is still provisioning. Repeat the call with the same request_id
  // and arguments to observe progress or recover a lost reply; the same
  // request_id with a different workload, machine_profile, release_id,
  // app_id or credential fails with ALREADY_EXISTS; the lease is not part of
  // that match. A failed request stays failed; retry with a new request_id. A
  // JVM request is one machine lifetime: a JVM machine that exits fails its
  // request and is never replaced under it. GATEWAY machines are stateless
  // and are replaced under the same request, with the same credential. Fenced
  // by lease.
  rpc EnsureCapacity(EnsureCapacityRequest) returns (EnsureCapacityResponse);
  // Returns the capacity granted under an EnsureCapacity request_id. The
  // response is RELEASING until the machine is gone, then RELEASED; repeat the
  // call to observe that. Idempotent: releasing unknown capacity returns
  // RELEASED. Fenced by lease.
  rpc ReleaseCapacity(ReleaseCapacityRequest) returns (ReleaseCapacityResponse);
  // Records usage for accounting. At least once: the server deduplicates by
  // record ID, so retry a batch until it succeeds.
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse);
  // Ships a batch of log lines. At least once: the server drops entries it
  // already holds by (instance_id, sequence).
  rpc ReportLogs(ReportLogsRequest) returns (ReportLogsResponse);
  // Ships a batch of metric samples. Best effort: a lost batch need not be
  // resent.
  rpc ReportMetrics(ReportMetricsRequest) returns (ReportMetricsResponse);
  // Reports client addresses that failed Minecraft authentication at a
  // gateway. For an expiring period those addresses (IPv6 by prefix) cannot
  // wake environments through EdgeService.Wake. It never affects connections
  // to an awake environment.
  rpc ReportFailedAuth(ReportFailedAuthRequest) returns (ReportFailedAuthResponse);
}

message AttachRequest {
  // Unique to one run of the process: a restarted process uses a new one.
  string instance_id = 1;
  // The environment image version this process runs.
  string version = 2;
  // Set by core: this process owns the environment's log. Core first
  // attaches without it, taking no lease, to read log_store before it opens
  // its log; only then does it know the epoch to attach with.
  bool core = 3;
  // Set by core: the log epoch it serves. Every restore starts a new, higher epoch.
  uint64 epoch = 4;
}

// The environment's complete desired state.
message AttachResponse {
  // Increases with every change, including every Wake the management plane
  // accepts for the environment.
  uint64 revision = 1;
  string environment_id = 2;
  string project_id = 3;
  // The deployment to serve; empty until something is deployed.
  string deployment_id = 4;
  ReleaseArtifact release = 5;
  // Every secret granted to the environment. Rotation arrives as a new version here.
  repeated SecretValue secrets = 6;
  // Where to replicate the log; unset when replication is off.
  ObjectStore log_store = 7;
  // Set for forks: when the local log is empty, restore this snapshot first.
  Restore restore = 8;
  // Set for core: the lease this attach was granted. Constant for the stream.
  uint64 lease = 9;
}

// A release archive (`dist/<id>.tar.gz` from `chunk build`) to download.
message ReleaseArtifact {
  string release_id = 1;
  // Fetch with HTTP GET. If the URL is not presigned, send the environment's
  // bearer token. It may expire; attaching again returns a fresh one.
  string url = 2;
  // Hex SHA-256 of the archive bytes.
  string sha256 = 3;
  uint64 size_bytes = 4;
}

message SecretValue {
  string name = 1;
  uint64 version = 2;
  bytes value = 3;
}

// An S3-compatible prefix with credentials scoped to it.
message ObjectStore {
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  string prefix = 4;
  string access_key_id = 5;
  string secret_access_key = 6;
  // Set for temporary credentials.
  string session_token = 7;
  // When the credentials expire; attaching again returns fresh ones.
  google.protobuf.Timestamp expire_time = 8;
}

message Restore {
  // The source environment's log, readable only.
  ObjectStore source = 1;
  string snapshot_id = 2;
}

message ReportStatusRequest {
  // When core observed this status. Informational; it never orders reports.
  google.protobuf.Timestamp observe_time = 1;
  // Gateways ready for players, as host:port reachable from edges. The
  // management plane only routes to addresses on machines it provisioned for
  // this environment.
  repeated string gateway_addresses = 2;
  uint32 online_players = 3;
  // The latest `server.ping` hook result for each hostname.
  repeated PingStatus pings = 4;
  // Progress of the deployment from the latest desired state. It may instead
  // report ACTIVE for a previously desired deployment the environment
  // switched to whose ACTIVE the management plane has not accepted yet,
  // repeated under the current lease until it is; desired_revision still
  // names the desired state the environment observed.
  DeploymentProgress deployment = 5;
  // No players remain, the log is flushed and the wake alarm is handed off.
  // The management plane may suspend the environment only while this report
  // is the latest accepted one under the current lease and desired_revision
  // equals the current desired-state revision. Because every accepted Wake
  // advances that revision, a wake accepted after core observed its state
  // invalidates the report. Environments that never sleep leave it false.
  bool ready_to_suspend = 6;
  // The lease from this core's Attach.
  uint64 lease = 7;
  // Increases with every report under this lease.
  uint64 sequence = 8;
  // The AttachResponse revision this status reflects.
  uint64 desired_revision = 9;
  // Logins this core instance has admitted since it started, each from a
  // player a gateway authenticated. It never decreases within an instance,
  // so a report carries every login since the last one, even players who have
  // already left. The management plane refunds pending login wakes from it.
  uint64 logins = 10;
}

message PingStatus {
  string hostname = 1;
  // The Minecraft status response JSON.
  string status_json = 2;
}

message DeploymentProgress {
  string deployment_id = 1;
  // IN_PROGRESS, ACTIVE or FAILED. The management plane records ACTIVE for a
  // pending or in-progress deployment, and for a superseded one that is newer
  // than its current active deployment: it becomes active and newer
  // unfinished deployments stay desired. It ignores ACTIVE otherwise.
  DeploymentState state = 2;
  // Why the deployment failed.
  string message = 3;
}

message ReportStatusResponse {}

message SetWakeAlarmRequest {
  // The backend's wake generation within epoch.
  uint64 generation = 1;
  // When the next job is due; unset clears the alarm.
  google.protobuf.Timestamp due_time = 2;
  // The log epoch the backend serves, as registered through Attach.
  uint64 epoch = 3;
  // The lease from this core's Attach.
  uint64 lease = 4;
}

// The alarm now stored. A higher (epoch, generation) than the request means a
// newer alarm won and the request was not installed.
message SetWakeAlarmResponse {
  uint64 generation = 1;
  google.protobuf.Timestamp due_time = 2;
  uint64 epoch = 3;
}

message EnsureCapacityRequest {
  string request_id = 1;
  Workload workload = 2;
  // A machine profile named in the release's configuration, never a provider size.
  string machine_profile = 3;
  // The release whose machine profiles and JVM apps apply.
  string release_id = 4;
  // The release app to run. Required for WORKLOAD_JVM, empty otherwise.
  string app_id = 5;
  // The lease from this core's Attach.
  uint64 lease = 6;
  // The secret core minted for the machine, which the machine presents to
  // core. Required for WORKLOAD_GATEWAY and WORKLOAD_JVM. Management never
  // returns it, and a retry must repeat it.
  string credential = 7;
}

enum Workload {
  reserved 3;
  reserved "WORKLOAD_EXEC";
  WORKLOAD_UNSPECIFIED = 0;
  // JVMs for the release's apps.
  WORKLOAD_JVM = 1;
  // An extra gateway-only instance of the environment image.
  WORKLOAD_GATEWAY = 2;
}

message EnsureCapacityResponse {
  Capacity capacity = 1;
}

message Capacity {
  string request_id = 1;
  CapacityState state = 2;
  // The provider's machine ID once known. The machine presents its credential when it connects to core.
  string machine_id = 3;
  // Why provisioning failed.
  string message = 4;
}

enum CapacityState {
  CAPACITY_STATE_UNSPECIFIED = 0;
  CAPACITY_STATE_PROVISIONING = 1;
  CAPACITY_STATE_READY = 2;
  CAPACITY_STATE_FAILED = 3;
  // The machine is gone.
  CAPACITY_STATE_RELEASED = 4;
  // Released, and the machine is still being removed.
  CAPACITY_STATE_RELEASING = 5;
}

message ReleaseCapacityRequest {
  // The EnsureCapacity request_id.
  string request_id = 1;
  // The lease from this core's Attach.
  uint64 lease = 2;
}

message ReleaseCapacityResponse {
  Capacity capacity = 1;
}

message ReportUsageRequest {
  repeated UsageRecord records = 1;
}

// A span of time the environment was awake. Spans never overlap.
message UsageRecord {
  // Chosen by the environment; the deduplication key.
  string id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  // Connected player time summed over all players in the span.
  uint64 player_seconds = 4;
  // The core process that counted the span. Once another core's attach
  // supersedes that process, the server ends its spans where that happened,
  // scaling player_seconds to match, so its spans never overlap the next
  // owner's.
  string instance_id = 5;
}

message ReportUsageResponse {}

message ReportLogsRequest {
  repeated LogEntry entries = 1;
}

message ReportLogsResponse {}

message ReportMetricsRequest {
  repeated MetricSample samples = 1;
}

// A gauge, or a cumulative counter when the name ends in `_total`.
message MetricSample {
  string name = 1;
  map<string, string> labels = 2;
  google.protobuf.Timestamp time = 3;
  double value = 4;
  string instance_id = 5;
}

message ReportMetricsResponse {}

message ReportFailedAuthRequest {
  repeated FailedAuth failures = 1;
}

message FailedAuth {
  // The client IP address, without a port.
  string client_address = 1;
  google.protobuf.Timestamp time = 2;
}

message ReportFailedAuthResponse {}
