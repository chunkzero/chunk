// Payloads of the `jvm/<host>` topic: what core wants the JVM running host `<host>` to do. Only that JVM's credential
// may subscribe, with no arguments, deployment or caller, and the topic is fenced. It is snapshot-only: every update
// is a snapshot, `after` is ignored, and core sends no position-only updates. A key missing from a snapshot is one the
// JVM forgets.
// - `session/<id>`: a JvmSession the JVM runs, or ends once `finish` is set.
// - `delivery/<op>`: a JvmDelivery, a player core placed in one of those sessions under claim `<op>`. The JVM closes a
//   delivery it holds open once its key is gone, as if withdrawn, and forgets it once it is closed and its key gone.
// - `method/<op>`: a JvmMethodCall, a session method to run once as operation `<op>`. It is a work entry: it stays
//   until `chunk:method_result` records the method's result. Once it is gone, the JVM forgets it.
// - `stop`: a JvmStop, present once core wants the JVM to exit.
syntax = "proto3";

package chunk.sync.v1;

import "chunk/sync/v1/core.proto";
import "chunk/sync/v1/gateway.proto";

// A session core wants the JVM to run.
message JvmSession {
  // The session type, as `<app>/<session>`.
  string session_type = 1;
  // The players the session admits at once.
  uint32 capacity = 2;
  // The session's creation configuration as a JSON object; empty means `{}`. It never changes.
  bytes configuration_json = 3;
  // End the session: admit no more players, and report it ENDED once it has.
  bool finish = 4;
}

// Core wants the JVM to stop its sessions and exit. Core kills a JVM that is still running shortly after.
message JvmStop {}

// A player core wants the JVM to admit. A delivery moves through the phases of JvmDeliveryPhase, and only forward. The
// JVM prepares it once its session is ready and reports it PREPARED with a capability it mints. The gateway then
// connects the player, presenting that capability in PlayerSetup, and the JVM reports the delivery ATTACHED, then
// ARRIVED. A delivery the JVM can't prepare, whose player leaves, or that is withdrawn ends CLOSED. Only `withdraw`
// ever changes.
message JvmDelivery {
  // The session the player joins, as in its `session/<id>` key.
  string session = 1;
  // The commit that created the player's claim. Core ignores a report of the delivery with another generation.
  Position generation = 2;
  // Who the player authenticated as.
  PlayerIdentity player = 3;
  // Core wants the delivery closed: the JVM refuses or disconnects the player and reports it CLOSED, at once if it
  // never prepared it. Core removes the key once it's CLOSED.
  bool withdraw = 4;
}

// The payload of the `chunk:delivery` login plugin response, with which a gateway presents a player to the JVM.
message PlayerSetup {
  // The claim's operation ID, as in its `delivery/<op>` key.
  string operation_id = 1;
  // The capability of the claim's assignment, which the JVM minted for that delivery.
  bytes capability = 2;
}

// A session method core wants the JVM to run for a player once. Only `cancel` ever changes.
message JvmMethodCall {
  // The session the method runs in, as in its `session/<id>` key.
  string session = 1;
  // The method's name, as the session type declares it.
  string method = 2;
  // The method's arguments as JSON, which match its declaration, in at most 48 KiB.
  bytes arguments_json = 3;
  // The operation ID of the delivery, as in its `delivery/<op>` key, of the player the method runs for. The JVM runs
  // it only while that player is arrived in the session.
  string delivery = 4;
  // Unix time in milliseconds after which the JVM no longer starts the method.
  uint64 deadline_ms = 5;
  // Core no longer wants the method run. A method that hasn't started never does.
  bool cancel = 6;
}

// Methods a JVM calls with its own credential; core takes the JVM's host from that credential. Each carries no
// deployment or caller, and takes no operation ID.
// - `chunk:register` takes JvmRegistration and returns JvmRegistered. The JVM calls it before subscribing, so it names
//   no stream. The first registration is frozen: repeating it returns the same result, and one that differs fails
//   with INVALID. A JVM that outlived a core restart re-attaches through it, and until then its credential may call
//   nothing else.
// - `chunk:report` takes JvmReport and returns nothing. It names the JVM's current `jvm/<host>` stream in
//   `CallRequest.stream`, and fails with STOPPED once that stream is superseded. It is idempotent, since each report
//   carries the latest state of everything it lists.
// - `chunk:method_result` takes JvmMethodResult and returns nothing. Its operation ID is the method's, as in its
//   `method/<op>` key, and it names the JVM's current stream like `chunk:report`. Core records the first result for
//   each method and then removes its key. A repeat, or a result for a key core no longer sends, changes nothing.

// Arguments of `chunk:register`: who the JVM is, as its launch environment told it.
message JvmRegistration {
  // The process ID and generation the JVM was launched with.
  string process_id = 1;
  uint64 generation = 2;
  // The app the JVM runs.
  string app = 3;
  // The machine profile the JVM runs on.
  string profile = 4;
  // The SHA-256 digest of the app's artifact, in lowercase hex.
  string artifact_digest = 5;
  // The deployment the JVM runs. An inactive or unknown one fails with CONTRACT.
  string deployment = 6;
  // The address players connect to: a loopback or private address. A JVM that connects to core from another machine
  // must name the address it connects from. One that connects over loopback runs on core's machine, and may name
  // loopback or that machine's private address.
  string player_endpoint = 7;
  // The Minecraft protocol version the JVM speaks.
  int32 protocol = 8;
}

// The result of `chunk:register`.
message JvmRegistered {
  // The host the JVM runs; its topic is `jvm/<host>`.
  string host = 1;
}

// Arguments of `chunk:report`: the JVM's actual state.
message JvmReport {
  // The report lists every session and delivery the JVM holds. The first complete report on a stream attaches the
  // JVM, and core reconciles it once; a stream's reports before it fail with INVALID. Later reports may list only what
  // changed.
  bool complete = 1;
  repeated JvmSessionStatus sessions = 2;
  // The JVM's latest health. Core marks a JVM unhealthy once it has reported none for 10 seconds.
  JvmHealth health = 3;
  repeated JvmDeliveryStatus deliveries = 4;
}

// A session the JVM holds.
message JvmSessionStatus {
  // The session's ID, as in its `session/<id>` key.
  string id = 1;
  string session_type = 2;
  uint32 capacity = 3;
  JvmSessionPhase phase = 4;
  // Players with a slot reserved but not yet attached.
  uint32 prepared = 5;
  // Players attached to the session.
  uint32 attached = 6;
}

// Where a session is in its lifecycle.
enum JvmSessionPhase {
  JVM_SESSION_PHASE_UNSPECIFIED = 0;
  JVM_SESSION_PHASE_STARTING = 1;
  JVM_SESSION_PHASE_READY = 2;
  JVM_SESSION_PHASE_ENDING = 3;
  JVM_SESSION_PHASE_ENDED = 4;
  JVM_SESSION_PHASE_FAILED = 5;
}

// A delivery the JVM holds, including a closed one whose key is still in the topic or that it closed since its last
// report.
message JvmDeliveryStatus {
  // The claim's operation ID, as in its `delivery/<op>` key.
  string operation_id = 1;
  // The delivery's generation, as in its JvmDelivery.
  Position generation = 2;
  JvmDeliveryPhase phase = 3;
  // The 32 random bytes the JVM minted to admit the player, set while PREPARED.
  bytes capability = 4;
}

// Where a delivery is in its lifecycle.
enum JvmDeliveryPhase {
  JVM_DELIVERY_PHASE_UNSPECIFIED = 0;
  // The JVM holds a slot and expects the player with the capability.
  JVM_DELIVERY_PHASE_PREPARED = 1;
  // The JVM holds the player's connection.
  JVM_DELIVERY_PHASE_ATTACHED = 2;
  // The player is in the session.
  JVM_DELIVERY_PHASE_ARRIVED = 3;
  // The JVM is disconnecting the player.
  JVM_DELIVERY_PHASE_WITHDRAWING = 4;
  // The JVM holds neither the player nor a slot for them.
  JVM_DELIVERY_PHASE_CLOSED = 5;
}

// Arguments of `chunk:method_result`: how a session method ended.
message JvmMethodResult {
  JvmMethodPhase phase = 1;
  // What the method returned as JSON, which matches its declaration, in at most 48 KiB. Set only when COMPLETED.
  bytes result_json = 2;
}

// How a session method ended.
enum JvmMethodPhase {
  JVM_METHOD_PHASE_UNSPECIFIED = 0;
  JVM_METHOD_PHASE_COMPLETED = 1;
  // The method never ran and never will: `cancel` or its deadline came first, or its player wasn't arrived.
  JVM_METHOD_PHASE_CANCELLED = 2;
  // The method threw or returned an invalid result. It may have changed state.
  JVM_METHOD_PHASE_FAILED = 3;
}

// A sample of the JVM's health.
message JvmHealth {
  // The JVM admits players.
  bool ready = 1;
  // The JVM is shutting down; core retires its host.
  bool draining = 2;
  // Server ticks since the JVM started, and how long ago the last one ended.
  uint64 tick_count = 3;
  uint64 last_tick_age_millis = 4;
  uint64 heap_used_bytes = 5;
  uint64 heap_max_bytes = 6;
  uint64 gc_count = 7;
  uint64 gc_time_millis = 8;
  // The JVM's share of the machine's CPU, from 0 to 1.
  double process_cpu_load = 9;
  uint32 sessions = 10;
  uint32 players = 11;
}

// Methods a remote runner calls before it starts a JVM, to learn what its host runs and to download that release. Only
// the JVM machine credential core minted for the host may call them, never a process credential, with no deployment,
// caller or stream. They ignore the operation ID. A host is booted once: a runner makes up a boot ID each time its
// machine starts, and after a full stop the machine must be replaced, since only a suspend resumes the same JVM.
// - `chunk:launch` takes JvmBoot and returns JvmLaunch. The first call binds the host to its boot, and a repeat with
//   that boot returns the same launch. Any other boot is DENIED for good. A host core launches nothing on is DENIED
//   too, and one whose release archive core no longer keeps fails with CONTRACT.
// - `chunk:archive` takes JvmArchiveRead and returns JvmArchiveChunk: the bytes of the host's release archive from
//   `offset`, at most 4 MiB, which only the bound boot may read. An offset at or past the archive's end is INVALID.
//   A host reads one chunk at a time, and a read while another of its reads runs gets OVERLOADED. The runner checks
//   the whole archive against JvmLaunch's size and digest before unpacking it.

// Arguments of `chunk:launch` and the runner's identity: a random ID the runner makes up once per boot, 1 to 128 bytes.
message JvmBoot {
  string boot = 1;
}

// What a host runs. The runner starts the JVM with these values.
message JvmLaunch {
  // The deployment the JVM registers with.
  string deployment = 1;
  // The release whose archive `chunk:archive` serves, and that archive's size and SHA-256 digest in lowercase hex.
  string release_id = 2;
  uint64 archive_size = 3;
  string archive_sha256 = 4;
  // The app the JVM runs, and the machine profile it runs on.
  string app = 5;
  string profile = 6;
  // The process ID and generation the JVM registers with.
  string process_id = 7;
  uint64 generation = 8;
}

// Arguments of `chunk:archive`.
message JvmArchiveRead {
  // The boot bound to the host.
  string boot = 1;
  // Where the chunk starts in the archive.
  uint64 offset = 2;
}

// The result of `chunk:archive`: the archive's bytes from the requested offset, at most 4 MiB.
message JvmArchiveChunk {
  bytes data = 1;
}
