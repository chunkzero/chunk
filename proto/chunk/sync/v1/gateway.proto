// Payloads of the `gateway/<id>` topic: the claims gateway `<id>` holds, from the players it admitted or is moving
// until each is released. Only that gateway's credential may subscribe, with GatewayArguments as its arguments and no
// deployment or caller, and the topic is fenced. Each entry's key is a claim's operation ID and its value a
// GatewayClaim; a released claim's key is removed. A pending move stays on its source claim until the gateway claims
// or abandons it, or control cancels it.
//
// Ownership. The instance a subscription names owns the topic. A subscription naming a new instance takes the topic
// over: the previous instance is retired and its stream ends with SUPERSEDED. The current instance may subscribe
// again at any time, with or without a cursor, and a retired one's subscription is rejected with SUPERSEDED. Core
// fences the new stream before it reads the first update, so that update reflects every commit before the takeover;
// a call the retired instance made before then may still commit after it.
syntax = "proto3";

package chunk.sync.v1;

import "chunk/sync/v1/core.proto";

// Arguments of a `gateway/<id>` subscription.
message GatewayArguments {
  // Names the gateway process, in 1 to 64 bytes. A process picks a random one when it starts and names it in every
  // subscription.
  string instance = 1;
}

// An open claim of this gateway.
message GatewayClaim {
  // The commit that created the claim. A view at or past it that lacks the claim's key means it was released.
  Position generation = 1;
  // How far the player's admission has progressed.
  ClaimPhase phase = 2;
  // The move queued from this arrived claim, if any.
  GatewayMove pending_move = 3;
  // The connection its login named, as in GatewayLogin; a move's claim keeps its source's.
  string connection_id = 4;
}

// Where an open claim is in its lifecycle.
enum ClaimPhase {
  CLAIM_PHASE_UNSPECIFIED = 0;
  // A session slot is reserved and the player's delivery is being prepared.
  CLAIM_PHASE_RESERVED = 1;
  // The gateway asked to activate the claim, and its JVM is admitting the player.
  CLAIM_PHASE_ACTIVATING = 2;
  // The JVM holds the player's connection.
  CLAIM_PHASE_ATTACHED = 3;
  // The player is in the session.
  CLAIM_PHASE_ARRIVED = 4;
  // The delivery is being withdrawn before the claim is released.
  CLAIM_PHASE_WITHDRAWING = 5;
}

// A move control queued for a player, which the gateway carries out by claiming its destination.
message GatewayMove {
  // The destination claim's operation ID.
  string operation_id = 1;
  // The session the player moves to.
  SessionDemand destination = 2;
}

// A session a player is placed in.
message SessionDemand {
  // The routing key that picks the session, in 1 to 128 bytes.
  string key = 1;
  // The session type, as `<app>/<session>`.
  string session_type = 2;
  // The machine profile the session runs on.
  string machine_profile = 3;
}

// The `deployment` topic carries the deployment gateways route new logins with: the current release's. Any gateway
// credential may subscribe, with no arguments, deployment or caller. Every update is a snapshot, including a resumed
// stream's first, and core sends one whenever the current release changes. Its one entry is keyed `current` and its
// value is a GatewayDeployment; the snapshot is empty while no release is current.

// The value of the `deployment` topic's `current` entry.
message GatewayDeployment {
  // The current release's deployment, which GatewayLogin.deployment and hook calls name.
  string deployment = 1;
}

// Methods a gateway calls to admit players and move them, with its own credential only; core takes the gateway's ID
// from that credential. Each call names the gateway's current `gateway/<id>` stream in `CallRequest.stream`, and
// fails with STOPPED once that stream is superseded or if it names another. It carries no deployment or caller. Its
// operation ID is the claim's own, at most 128 bytes rather than the protocol's 256: `chunk:claim` creates the claim
// under it, and the other methods act on that claim or queued move. A claim or queued move already under it must be
// the gateway's. Each is idempotent, so a retry returns the claim's current outcome, and `chunk:claim` repeated with
// other arguments, including a login under a move's operation ID or the reverse, fails with
// OPERATION_MISMATCH. A result's position is control's state after the call, which the gateway's topic reaches.
// - `chunk:claim` takes ClaimArguments and returns ClaimResult.
// - `chunk:activate` takes no arguments and returns ActivateResult.
// - `chunk:withdraw` takes no arguments and returns WithdrawResult.
// - `chunk:abandon_move` takes AbandonMoveArguments and returns WithdrawResult.
// - `chunk:depart` takes no arguments and returns DepartResult.

// Arguments of `chunk:claim`.
message ClaimArguments {
  // The player a login admits. Unset to claim the destination of the move control queued under the operation ID,
  // which the gateway saw as a GatewayMove.
  GatewayLogin login = 1;
}

// A player the gateway authenticated and routed. The claim control makes from it, with the gateway's ID, the operation
// ID and every profile property, encodes in at most 65,536 bytes rather than the protocol's 1 MiB of arguments.
message GatewayLogin {
  // Names the player's connection to this gateway, in 1 to 128 bytes; its moves keep it.
  string connection_id = 1;
  // Who the player authenticated as.
  PlayerIdentity player = 2;
  // The session routing chose.
  SessionDemand demand = 3;
  // The deployment whose routing chose `demand`. Empty places the login with the current one.
  string deployment = 4;
}

// A player as their login authenticated them.
message PlayerIdentity {
  // The player's UUID, lowercase and hyphenated.
  string uuid = 1;
  // The player's name: 1 to 16 letters, digits or underscores.
  string username = 2;
  // The profile's properties, such as its skin, which the JVM receives.
  repeated PlayerProperty properties = 3;
}

// A property of a player's profile.
message PlayerProperty {
  // The property's name.
  string name = 1;
  // The property's value.
  string value = 2;
  // The value's signature, when the session service signed it.
  optional string signature = 3;
}

// The result of `chunk:claim`.
message ClaimResult {
  oneof outcome {
    // The claim holds a slot, and the destination JVM expects the player.
    ClaimAssignment assignment = 1;
    // Why control refused the claim, which reserved nothing.
    ClaimRefusal refusal = 2;
  }
}

// Where a claim's player joins.
message ClaimAssignment {
  // The commit that created the claim, as in GatewayClaim.
  Position generation = 1;
  // The session the player joins.
  string session = 2;
  // The Minecraft protocol version the destination JVM speaks.
  int32 protocol = 3;
  // The destination JVM's player endpoint, which the gateway connects the player to.
  string endpoint = 4;
  // The 32-byte secret that presents the player to the JVM at login.
  bytes capability = 5;
}

// Why control refused a claim.
enum ClaimRefusal {
  CLAIM_REFUSAL_UNSPECIFIED = 0;
  // The login's deployment no longer accepts logins. Route it again and claim again under the same operation ID.
  CLAIM_REFUSAL_ROUTE_AGAIN = 1;
  // The player already holds a claim, such as through another connection.
  CLAIM_REFUSAL_ALREADY_CONNECTED = 2;
}

// The result of `chunk:activate`.
message ActivateResult {
  // Other members of the player's roster have yet to activate, so none was admitted. Call again.
  bool waiting = 1;
}

// Arguments of `chunk:abandon_move`.
message AbandonMoveArguments {
  // Why preparing the move failed, in 1 to 4096 bytes.
  string reason = 1;
}

// The result of `chunk:withdraw` and `chunk:abandon_move`.
message WithdrawResult {
  // Control holds no claim or queued move under the operation ID, such as while its claim is still reserving, so
  // nothing changed.
  bool unknown = 1;
}

// The result of `chunk:depart`.
message DepartResult {
  // The player's membership ended with this claim, and they hold no newer claim.
  bool departed = 1;
}

// Hooks. A gateway runs the domain hooks of a deployment's manifest as effectful calls: `chunk:prepare`, then a Call
// whose method is the hook's ID, whose deployment is the manifest's, and whose arguments are the hook's event as JSON.
// Only a gateway may call a hook. App code receives the caller `{"kind":"gateway"}`, with `"player"` when the call
// names one, which it may only while it holds that player's claim; the event's arguments identify the player either
// way. A call under an ID core didn't prepare gets OUTCOME_UNKNOWN, and a retry returns the hook's outcome until core
// retires it.
// - `chunk:manifest` takes no arguments or caller and returns ManifestResult. Its deployment names the one to read, or
//   is empty for the current release's.

// The result of `chunk:manifest`.
message ManifestResult {
  // The deployment the manifest belongs to, which the gateway's hook calls name.
  string deployment = 1;
  // The deployment's domain manifest as JSON, with its scopes, apps, hooks and commands. Empty when it declares none.
  bytes manifest_json = 2;
}

// Commands. A gateway runs the commands of the deployment its player's session runs, for a player whose claim it holds
// and that has arrived. Only a gateway may call these, and each call names its current `gateway/<id>` stream in
// `CallRequest.stream`, as the claim methods do. `chunk:commands` and `chunk:suggest` name the player in their caller,
// and none takes a deployment: core derives a command's scope from control's state, the session the player's claim is
// delivered to, the deployment its host runs and the domain of the session's app. Permission and suggestion queries,
// and a command's handler, see the caller `{"kind":"gateway","player":"<uuid>"}`.
// - `chunk:commands` takes no arguments and returns CommandsResult.
// - `chunk:suggest` takes SuggestArguments and returns SuggestResult.
// - `chunk:command` starts a command as an effectful call under an operation ID `chunk:prepare` issued. It takes
//   CommandArguments and a caller naming the player, and returns CommandStarted once the backend admitted the command,
//   which then belongs to the calling gateway credential. It resolves the operation ID first: under an unused one it
//   derives the command's scope from the player's current claim, and a rejection leaves the ID unused, though one a
//   subscription reserved keeps the command, input and player its first start named. A retry under an ID whose command
//   started returns CommandStarted again without consulting the player's claim or deployment; one by another
//   credential gets DENIED, and one that changes the command, input or player, or under an ID that ran an action or
//   hook, gets OPERATION_MISMATCH. At most 4 retries and subscriptions wait while the backend admits the
//   command; later ones get UNAVAILABLE, as does a waiting retry whose command was rejected. A start under an ID whose
//   subscription closed before the command started gets STOPPED.
// - `chunk:effect` acknowledges one effect from a `command/<op>` topic. It takes EffectArguments and no caller or
//   operation ID, and returns EffectResult. The command's effect resolves with the acknowledgment.
//
// The `command/<op>` topic carries the command started under `<op>` to the gateway credential that owns it, and any
// other credential gets DENIED. A subscription takes a CommandSubscription as its arguments and no deployment or
// caller. One under an unused ID reserves it for the subscribing gateway credential: it sends an empty snapshot at
// once, then nothing until the command starts, through a later start if one is rejected. Closing a subscription before
// its command started cancels the command, including a start waiting for admission, which gets STOPPED, and core
// refuses a later start under the ID with STOPPED for at least 60 seconds. A subscription waiting for a start counts as
// one of the calls that may wait for it. One subscription follows a command at a time, and a newer one ends the older
// with STOPPED. Every update is a snapshot without a position. Each entry's key is a pending effect's sequence number
// in decimal and its value a CommandEffect, which waits for the gateway to render it to its player and acknowledge it.
// At most 8 effects are pending at once; the command's later ones fail until the gateway acknowledges some. A command
// finishes once its handler returned and the session methods it called or sent settled, bounded by their deadline. Then
// its pending effects fail and the final snapshot holds one entry, keyed `outcome`, whose value is a CommandOutcome,
// after which the stream ends. A subscription after the command finished gets that final snapshot while core retains
// the outcome. The topic anchors the command's lifetime: core cancels a running command once its subscription closes,
// as the gateway closes it at session cutover, or at disconnect for a command that follows its player, or at its
// deadline. Cancelling stops the handler and fails its pending and later effects, including session methods core hasn't
// called yet; a move already queued stays. A command no subscription opens for within 5 seconds of starting is
// cancelled, as is one whose subscription ended because the gateway stream it names was superseded, unless the gateway
// follows the command again from its new stream within 5 seconds. Such a stream ends with STOPPED.

// Arguments of a `command/<op>` subscription.
message CommandSubscription {
  // The gateway's current `gateway/<id>` stream.
  string stream = 1;
}

// The result of `chunk:commands`.
message CommandsResult {
  // The commands the player's session sees, as JSON: a map from command ID to its descriptor in the domain manifest.
  bytes commands_json = 1;
  // The IDs of the commands the player may run.
  repeated string allowed = 2;
}

// Arguments of `chunk:suggest`.
message SuggestArguments {
  // The command the input selects.
  string command_id = 1;
  // One of the command's declared suggestion queries.
  string query = 2;
  // The command input typed so far, without its leading slash.
  string input = 3;
  // The cursor's position in `input`, in UTF-16 code units.
  uint32 cursor = 4;
}

// The result of `chunk:suggest`.
message SuggestResult {
  // At most 64 suggestions.
  repeated string values = 1;
}

// Arguments of `chunk:command`.
message CommandArguments {
  // The command to run.
  string command_id = 1;
  // The command input, without its leading slash, which core parses again.
  string input = 2;
}

// The result of `chunk:command`: the command started, and its effects and outcome follow on its `command/<op>` topic.
message CommandStarted {}

// How a command finished, the final entry on its `command/<op>` topic.
message CommandOutcome {
  oneof outcome {
    // What the command's handler returned, as JSON.
    bytes result_json = 1;
    // Why the command failed, or that it was cancelled.
    Error error = 2;
  }
}

// An effect the gateway renders to the player a command runs for.
message CommandEffect {
  oneof effect {
    // A chat message.
    string message = 1;
    // An action bar message.
    string action_bar = 2;
    // A title.
    CommandTitle title = 3;
  }
}

// A title, with an optional subtitle.
message CommandTitle {
  string title = 1;
  optional string subtitle = 2;
}

// Arguments of `chunk:effect`.
message EffectArguments {
  // The operation ID of the command the effect belongs to.
  string operation_id = 1;
  // The effect's sequence number, its key on the command's topic.
  uint32 sequence = 2;
  // The gateway couldn't render the effect.
  bool failed = 3;
}

// The result of `chunk:effect`.
message EffectResult {
  // No such effect is pending, as when it was already acknowledged or its command finished, so nothing changed.
  bool unknown = 1;
}
