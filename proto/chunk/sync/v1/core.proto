// The sync protocol: the one contract between an environment's core and everything that dials it (gateways, JVMs,
// exec and the CLI). Call runs one method; Subscribe follows one topic.
//
// Names. Methods and topics are strings. A method is an app function path from the deployment's contract, or a
// platform method named `chunk:<name>`; function paths never contain `:`. Planned topic families, not normative:
// `deployment`, `queries`, `gateway/<id>`, `jvm/<host>`, `command/<op>`, `method/<op>`, `nodes`, `players`.
//
// Encoding. `arguments`, `result` and entry values are UTF-8 JSON for app functions and query topics, and protobuf
// messages declared by each `chunk:*` method or platform topic otherwise.
//
// Operations. Methods that write require an operation ID; reads, and idempotent `chunk:register` and `chunk:report`,
// ignore it, except a reserved `prep:` ID (see PrepareResult). A duplicate of a running operation waits for its
// outcome instead of running again. A retry must repeat the first request, and one whose method, arguments or caller
// differ fails with OPERATION_MISMATCH. Each method is one of two kinds:
// - Transactional methods (mutations, `chunk:commit`) take effect only by committing. Core records a committed
//   outcome with the commit, and a retry returns it until retention expires (24 hours by default). A failure
//   committed nothing, so its retry runs again, as does a retry after expiry or after a restore lost the commit.
// - Effectful methods (actions, hooks, commands, session methods) may act outside the log, so each runs at most once.
//   Their operation IDs are issued by core through `chunk:prepare`. Core returns an outcome, success or failure,
//   until it retires it. An action runs on after its call is dropped, so a retry finds its outcome; a hook is
//   cancelled when its call is dropped, and a retry then finds it cancelled. A retry whose outcome is unknown,
//   retired, or from before core restarted or restored gets OUTCOME_UNKNOWN.
//
// Positions. A position names a commit in the environment's log, ordered by epoch, then revision. Both start at 1,
// and an unset position means none. A restore starts a new epoch, whose revisions may repeat numbers from a lost tail
// of the previous one, so a pair is never reused. A claim generation is the position of the commit that created it.
//
// Subscriptions. A topic's state is a map from key to value. Each stream's first update names the stream, unless the
// subscription is rejected, in which case its only update is the terminal error. The stream
// starts with a snapshot unless `after` names a stream of the same topic, arguments, deployment, caller and credential
// and a position of the current epoch within retained history, not ahead of the current position; then it starts
// with the changes after that position, possibly none. Either way the first update reflects the current position.
// Once a client applies an update, its view equals the topic's state at that update's position, so a slow subscriber
// gets the latest value of each key, never an intermediate one, and positions never decrease. A topic whose values
// include state outside the log, such as `nodes`' health, may change them in updates at an unchanged position; its
// view then equals the topic's state when the update was sent. Core may send a fresh
// snapshot at any time. An update with `continued` is followed by more at the same position: apply the sequence
// together, and discard it if the stream breaks. To resume, subscribe with `after` set to the stream and the last
// applied position.
//
// Topic rules. A topic that delivers work gives each item a key it never reuses and keeps the item until the client
// acknowledges it with a Call, so coalescing never drops pending work. `jvm/<host>` delivers each player placed on the
// JVM as a `delivery/<op>` entry, which the JVM's reports close, and each session method as a `method/<op>` entry,
// which `chunk:method_result` acknowledges. A topic with one attached client, such as
// `jvm/<host>`, fences it: a newer stream supersedes older ones, which end with STOPPED, and calls reporting on the
// topic name their stream and fail with STOPPED once it's superseded. `chunk:register`, which a JVM calls before it
// subscribes, is the exception and names no stream.
//
// Errors. Protocol errors are values: `CallResponse.error`, `Entry.error` for a query that failed while its
// subscription continues, and `Update.error` on a stream's final update. A non-OK gRPC status means core may not
// have handled the request: UNAUTHENTICATED for a missing or rejected credential, otherwise a transport failure with
// an unknown outcome. Retry the call with the same operation ID, or resume the subscription.
//
// Auth. Every request carries `authorization: Bearer <credential>` metadata. Core derives the credential's class
// (gateway, jvm, exec or cli) and identity from it, and checks each method, topic, deployment and caller against
// them; request fields are never authority. `cli` is the operator class: the `chunk` CLI presents control's
// credential, and only it may use the operator surface in operator.proto.
//
// Limits. Operation IDs are at most 256 bytes; methods, topics, deployments, keys, stream IDs and caller fields at
// most 512 bytes. `arguments` is at most 1 MiB unless its method declares more: `chunk:commit` carries a mutation's
// whole write set (up to 8 MiB) in one request, so it commits atomically without staging. Every message is at most
// 16 MiB, so a result or entry must fit in one; core splits larger snapshots and changes across continued updates.
syntax = "proto3";

package chunk.sync.v1;

service Core {
  rpc Call(CallRequest) returns (CallResponse);
  rpc Subscribe(SubscribeRequest) returns (stream Update);
}

message Position {
  uint64 epoch = 1;
  uint64 revision = 2;
}

// Who a request acts for. Core checks it against current ownership and builds the caller app code receives. A
// gateway names a player it holds a claim for. A JVM names a session its host runs and, optionally, a player on that
// session. Exec and the CLI name none.
message Caller {
  string session = 1;
  string player = 2;
}

message CallRequest {
  // Required for methods that write.
  string operation_id = 1;
  string method = 2;
  bytes arguments = 3;
  // The deployment an app function runs in. Empty for `chunk:*` methods unless one says otherwise.
  string deployment = 4;
  Caller caller = 5;
  // The stream a report on a fenced topic belongs to.
  string stream = 6;
}

message CallResponse {
  // The commit a write created, or the state a read observed. Unset on error and for methods that touch no state.
  // Unset for actions and hooks too, whose effects may span any number of commits.
  Position position = 1;
  oneof outcome {
    bytes result = 2;
    Error error = 3;
  }
}

message SubscribeRequest {
  string topic = 1;
  bytes arguments = 2;
  // The last position the client applied, and the stream it came from. Unset to start from a snapshot.
  Cursor after = 3;
  // As in CallRequest, for topics that run app functions.
  string deployment = 4;
  Caller caller = 5;
}

message Cursor {
  string stream = 1;
  Position position = 2;
}

message Update {
  Position position = 1;
  // Replaces the client's whole view instead of changing it.
  bool snapshot = 2;
  // Each key appears at most once per update, in either list.
  repeated Entry upserts = 3;
  repeated string removed = 4;
  // More updates at this position follow and belong to this one.
  bool continued = 5;
  // Set only on the stream's final update, which carries nothing else.
  Error error = 6;
  // Set only on the stream's first update. Opaque; it binds the stream's scope and credential.
  string stream = 7;
}

message Entry {
  string key = 1;
  oneof state {
    bytes value = 2;
    // The key's query failed. A later update may replace it with a value.
    Error error = 3;
  }
}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    // Retryable with the same operation ID, which returns the outcome if the operation did run. Core, exec or
    // storage can't take the request right now.
    CODE_UNAVAILABLE = 1;
    // Retryable after backing off. An admission limit or storage budget refused the request; the message names it.
    CODE_OVERLOADED = 2;
    // The rest are not retryable as sent. Bad encoding, a missing operation ID, an unknown method or topic, or an
    // exceeded size limit.
    CODE_INVALID = 3;
    // The credential may not use this method, topic, deployment or caller.
    CODE_DENIED = 4;
    // The deployment isn't active, has no such function, or the arguments or result break its contract.
    CODE_CONTRACT = 5;
    // The operation ID was first used for a different request.
    CODE_OPERATION_MISMATCH = 6;
    // The app function threw or ran past its deadline. The message is what it threw.
    CODE_APPLICATION = 7;
    // The session, JVM or host the request addresses has stopped, or the stream it names was superseded.
    CODE_STOPPED = 8;
    // An effectful operation may or may not have taken effect, and core no longer knows. Never retry it under a new
    // ID.
    CODE_OUTCOME_UNKNOWN = 9;
  }
  Code code = 1;
  string message = 2;
}

// The result of `chunk:prepare`, which issues the operation ID of one effectful call: an app action, or for a gateway,
// a hook or command. Any credential may call it, with no operation ID, arguments, deployment or caller, and each call
// issues one ID. The effectful call and its retries use that ID. A call under an ID this core didn't issue, or issued
// before it restarted or restored, gets OUTCOME_UNKNOWN, as does one whose outcome core retired. Core retains an
// outcome for up to 24 hours, or less under memory pressure (oldest completed first), and an unused ID for 24 hours.
// `chunk:prepare` gets OVERLOADED only while running calls and unused IDs fill the retention budget.
// Issued IDs begin with `prep:`, which is reserved: actions, hooks and commands require such an ID. Any other call
// under a `prep:` ID first resolves it: one this core never issued or no longer holds gets OUTCOME_UNKNOWN, one that
// ran an action, hook or command gets OPERATION_MISMATCH, and an unused one is INVALID.
message PrepareResult {
  // The issued operation ID.
  string operation_id = 1;
}
