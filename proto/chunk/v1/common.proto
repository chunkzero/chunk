// Incomplete internal transport proposal; see docs/architecture.md.
syntax = "proto3";

package chunk.v1;

option java_multiple_files = true;
option java_package = "dev.chunkzero.proto";

// A stable player identity. Never a raw UUID: the proxy issues it at login and
// it survives moves, restarts and proxy transfers.
message PlayerRef {
  string id = 1;
}

// An immutable release within an environment. Authentication must authorize
// this scope; caller-supplied identifiers alone are not authority.
message DeploymentRef {
  string environment = 1;
  string deployment = 2;
}

// A running session, wherever its process is.
message SessionRef {
  string id = 1;
}

// What the proxy verified at login and forwards on delivery.
message Identity {
  string uuid = 1;
  string username = 2;
  repeated Property properties = 3;
}

message Property {
  string name = 1;
  string value = 2;
  optional string signature = 3;
}

// A stable platform error code plus the message the function threw.
message Error {
  string code = 1;
  string message = 2;
}
