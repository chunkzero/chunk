syntax = "proto3";

package chunk.v1;

import "google/protobuf/empty.proto";

// Loopback service authenticated by an environment credential. Every RPC carries
// x-chunk-environment and x-chunk-deployment metadata, fixed by the owning client.
// Only trusted platform processes supply caller context.
service Backend {
  rpc CheckDeployment(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Query(BackendQuery) returns (BackendResult);
  rpc Mutate(BackendMutation) returns (BackendResult);
  rpc WatchGroup(BackendWatchGroup) returns (stream BackendUpdate);
}

message BackendQuery {
  string function = 1;
  bytes arguments_json = 2;
  bytes caller_json = 3;
}

message BackendMutation {
  string function = 1;
  bytes arguments_json = 2;
  bytes caller_json = 3;
  // Required. Reuse the same ID and deployment when recovering a lost reply.
  string operation_id = 4;
}

message BackendResult {
  uint64 revision = 1;
  bytes result_json = 2;
}

message BackendWatchGroup {
  repeated BackendQuery queries = 1;
}

// Every reconnect begins with a fresh full group. Clients mark retained results
// stale on stream failure and clear stale only when they receive this snapshot.
message BackendUpdate {
  uint64 revision = 1;
  repeated bytes results_json = 2;
  // Same order and length as results_json. An error has empty JSON and a
  // nonempty message; successful JSON null is the bytes "null". Query errors
  // remain reactive and do not close the group or mark transport state stale.
  repeated string errors = 3;
}
