// Session processes calling edge functions. The generated Edge client is the
// only thing that uses this. Proposed.
syntax = "proto3";

package chunk.v1;

import "chunk/v1/common.proto";

service EdgeCall {
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  // The current result now and again whenever it changes, until cancelled.
  rpc Subscribe(SubscribeRequest) returns (stream SubscriptionUpdate);
}

message InvokeRequest {
  // A function ref from the contract, such as "duels.setKit".
  string function = 1;
  // Arguments in the contract's wire encoding for that function.
  bytes args = 2;
  // Set when the call is made on behalf of a player; becomes ctx.player.
  optional PlayerRef player = 3;
}

message InvokeResponse {
  oneof outcome {
    bytes result = 1;
    Error error = 2;
  }
}

message SubscribeRequest {
  string query = 1;
  bytes args = 2;
}

message SubscriptionUpdate {
  oneof outcome {
    bytes result = 1;
    Error error = 2;
  }
}
