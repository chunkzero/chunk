syntax = "proto3";

package chunk.v1;

import "chunk/v1/common.proto";
import "chunk/v1/gameplay.proto";

// Registration authenticates the launched child. Repeating the exact frozen
// registration reconciles a channel outage without replacing any player socket.
service Supervisor {
  rpc RegisterProcess(ProcessRegistration) returns (ProcessIdentity);
  // Opened by a registered JVM with its process credential. The first report lists everything the JVM holds, which
  // control reconciles once; later reports carry only changes. Control streams the sessions the JVM should run or end:
  // all of them first, then changes.
  rpc Sync(stream ProcessReport) returns (stream DesiredSessions);
}

service NodeControl {
  rpc Health(ProcessIdentity) returns (ProcessHealth);
  rpc StopProcess(ProcessIdentity) returns (ProcessIdentity);
}

message SessionCommand {
  ProcessIdentity identity = 1;
  string operation_id = 2;
  SessionRef session = 3;
  uint64 generation = 4;
  string session_type = 5;
  uint32 capacity = 6;
  // Immutable creation configuration; an absent payload means the legacy empty object.
  bytes configuration_json = 7;
}

message ProcessIdentity {
  DeploymentRef deployment = 1;
  string runtime_id = 2;
  string process_id = 3;
  uint64 generation = 4;
  string machine_profile = 5;
  string artifact_digest = 6;
  string app_id = 7;
}

message ProcessRegistration {
  ProcessIdentity identity = 1;
  string control_endpoint = 2;
  string player_endpoint = 3;
  reserved 4, 5;
  reserved "configuration", "manifest_digest";
}

message ProcessHealth {
  ProcessIdentity identity = 1;
  bool ready = 2;
  bool draining = 3;
  uint64 tick_count = 4;
  uint64 last_tick_age_millis = 5;
  uint64 heap_used_bytes = 6;
  uint64 heap_max_bytes = 7;
  uint64 gc_count = 8;
  uint64 gc_time_millis = 9;
  double process_cpu_load = 10;
  uint32 sessions = 11;
  uint32 players = 12;
}

enum DeliveryPhase {
  DELIVERY_PHASE_UNSPECIFIED = 0;
  DELIVERY_PHASE_PREPARED = 1;
  DELIVERY_PHASE_ATTACHED = 2;
  DELIVERY_PHASE_ARRIVED = 3;
  DELIVERY_PHASE_CLOSED = 4;
  DELIVERY_PHASE_WITHDRAWING = 5;
}

message DeliveryInventory {
  PlayerDelivery delivery = 1;
  DeliveryPhase phase = 2;
}

enum SessionPhase {
  SESSION_PHASE_UNSPECIFIED = 0;
  SESSION_PHASE_STARTING = 1;
  SESSION_PHASE_READY = 2;
  SESSION_PHASE_ENDING = 3;
  SESSION_PHASE_ENDED = 4;
  SESSION_PHASE_FAILED = 5;
}

message SessionInventory {
  SessionRef session = 1;
  uint64 generation = 2;
  string session_type = 3;
  SessionPhase phase = 4;
  uint32 capacity = 5;
  uint32 prepared = 6;
  uint32 attached = 7;
}

// A JVM's actual sessions and deliveries.
message ProcessReport {
  ProcessIdentity identity = 1;
  repeated SessionInventory sessions = 2;
  repeated DeliveryInventory deliveries = 3;
}

message DesiredSessions {
  repeated SessionCommand create = 1;
  repeated SessionCommand finish = 2;
  // Sessions control no longer tracks. The process drops each one's record once
  // it has ended or failed.
  repeated SessionRef forget = 3;
}
