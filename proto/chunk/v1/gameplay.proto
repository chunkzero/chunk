syntax = "proto3";

package chunk.v1;

import "chunk/v1/common.proto";
import "chunk/v1/players.proto";

// Control calls require process credentials. Gameplay uses a dedicated TCP socket.
service Gameplay {
  rpc Configuration(ConfigurationRequest) returns (ConfigurationResponse);
  rpc PreparePlayer(PlayerDelivery) returns (PlayerPreparation);
  rpc ActivatePlayer(PlayerActivation) returns (PlayerPreparation);
}

message ConfigurationRequest {
  DeploymentRef deployment = 1;
}

message ConfigurationResponse {
  DeploymentRef deployment = 1;
  uint64 process_generation = 2;
  int32 protocol = 3;
  repeated Frame packets = 4;
  bytes registry_digest = 5;
}

message PlayerDelivery {
  DeploymentRef deployment = 1;
  uint64 process_generation = 2;
  string operation_id = 3;
  SessionRef session = 4;
  PlayerRef player = 5;
  uint64 owner_generation = 6;
  Identity identity = 7;
  int32 protocol = 8;
  bytes registry_digest = 9;
  bytes client_information = 10;
}

message PlayerPreparation {
  string operation_id = 1;
  string endpoint = 2;
  bytes capability = 3;
}

// TCP begins with a VarInt length and this message (at most 4096 bytes).
// Server replies with byte 0 after consuming the single-use capability.
// After activation, both directions carry ordinary length-prefixed play packets.
message PlayerSetup {
  string operation_id = 1;
  bytes capability = 2;
}

message PlayerActivation {
  string operation_id = 1;
  bytes client_information = 2;
}
