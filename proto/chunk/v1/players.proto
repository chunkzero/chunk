// Player frame streams between the edge and a session process. Delivery and
// withdrawal are Runtime commands; this service carries only the frames.
// Proposed.
syntax = "proto3";

package chunk.v1;

service Players {
  // One bidirectional stream per delivered player, opened by the process in
  // response to a Deliver command. The delivery id travels in request
  // metadata. Streams are multiplexed over the process's one HTTP/2
  // connection.
  rpc Stream(stream Frame) returns (stream Frame);
}

// One Minecraft packet: id and payload, no length prefix, no compression and
// no encryption. The edge terminates both on the client side. Whether frames
// should instead be one message per decoded packet is open (O8).
message Frame {
  bytes packet = 1;
}
