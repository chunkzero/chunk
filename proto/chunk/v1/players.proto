// Player frame streams between the proxy and a gameplay JVM. Delivery and
// withdrawal are Runtime commands; this service carries only the frames.
// Incomplete proposal; connection topology and reconnection remain open.
syntax = "proto3";

package chunk.v1;

option java_multiple_files = true;
option java_package = "dev.chunkzero.proto";

service Players {
  // One bidirectional stream per delivered player, opened by the process in
  // response to a Deliver command. The delivery id travels in request
  // metadata. This does not require sharing a connection with control or
  // backend function calls.
  rpc Stream(stream Frame) returns (stream Frame);
}

// One Minecraft packet: id and payload, no length prefix, no compression and
// no encryption. The proxy terminates both on the client side.
message Frame {
  bytes packet = 1;
}
