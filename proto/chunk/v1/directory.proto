// Incomplete control-plane directory and automatic placement proposal.
// Used internally by chunk, not application-managed session provisioning.
syntax = "proto3";

package chunk.v1;

import "chunk/v1/common.proto";

option java_multiple_files = true;
option java_package = "dev.chunkzero.proto";

service Directory {
  rpc ResolveSession(ResolveSessionRequest) returns (ResolveSessionResponse);
  rpc ResolveDatabase(ResolveDatabaseRequest) returns (ResolveDatabaseResponse);
  rpc Place(PlaceRequest) returns (PlaceResponse);
}

message ResolveSessionRequest {
  SessionRef session = 1;
}

message ResolveSessionResponse {
  string process = 1;
  string proxy = 2;
}

message ResolveDatabaseRequest {
  string environment = 1;
}

message ResolveDatabaseResponse {
  string backend = 1;
}

// Chunk chooses compatible JVM capacity for a declared session type.
message PlaceRequest {
  DeploymentRef deployment = 1;
  string session_type = 2;
  optional string region = 3;
  string machine_profile = 4;
}

message PlaceResponse {
  string process = 1;
}
