syntax = "proto3";

package chunk.v1;

import "chunk/v1/common.proto";
import "chunk/v1/gameplay.proto";
import "chunk/v1/session_methods.proto";
import "chunk/v1/supervision.proto";

// One authenticated local proxy group and one durable ownership authority.
service LocalControl {
  rpc Claim(ClaimRequest) returns (Assignment);
  rpc Activate(ActivateClaim) returns (Assignment);
  rpc Cancel(ClaimRequest) returns (ClaimIdentity);
  rpc ReconcileDeparture(ClaimRequest) returns (DepartureStatus);
  rpc MovePlayer(MovePlayerRequest) returns (ClaimRequest);
  // Streams the proxy's open claims: a snapshot, then changes. A slow reader receives only each claim's latest state.
  rpc Watch(WatchRequest) returns (stream ClaimUpdate);
  // Acknowledges the durable failure; reconciliation completes withdrawal before releasing capacity.
  rpc AbandonMove(AbandonMoveRequest) returns (ClaimIdentity);
  rpc Drain(DrainRequest) returns (DrainStatus);
  rpc Nodes(NodesRequest) returns (NodeList);
  rpc Players(PlayersRequest) returns (PlayerList);
  rpc ShutdownNode(ShutdownNodeRequest) returns (NodeStatus);
  rpc PrepareSessionMethod(PrepareSessionMethodRequest) returns (PreparedMethodHandle);
  rpc StartPreparedMethod(PreparedMethodRequest) returns (SessionMethodResult);
  rpc PollPreparedMethod(PreparedMethodRequest) returns (SessionMethodResult);
  rpc CancelPreparedMethod(PreparedMethodRequest) returns (SessionMethodResult);
}

message SessionDemand {
  string key = 1;
  string session_type = 2;
  string machine_profile = 3;
}

message ClaimRequest {
  string operation_id = 1;
  string proxy_id = 2;
  string connection_id = 3;
  Identity identity = 4;
  SessionDemand demand = 5;
  ClaimIdentity source = 6;
}

message MovePlayerRequest {
  string operation_id = 1;
  string player_id = 2;
  SessionDemand demand = 3;
  // Proxy effects supply both fields to fence the exact public connection and current owner.
  ClaimIdentity expected_source = 4;
  string expected_connection_id = 5;
}

message WatchRequest {
  string proxy_id = 1;
}

// An open claim and the move queued from it, as its proxy sees them.
message WatchedClaim {
  ClaimIdentity claim = 1;
  ClaimPhase phase = 2;
  // The destination of the move pending for this arrived claim, if any.
  ClaimRequest pending_move = 3;
}

message ClaimUpdate {
  // The control commit this update reflects, in the wire form of claim generations. A claim created at or before it
  // and absent from the view has been released.
  uint64 position = 1;
  // Replaces the whole view instead of changing it.
  bool snapshot = 2;
  repeated WatchedClaim claims = 3;
  // Operation IDs of claims released since the previous update.
  repeated string released = 4;
}

// Records a preparation failure and schedules this exact move's fenced withdrawal.
message AbandonMoveRequest {
  ClaimRequest claim = 1;
  string reason = 2;
}

message MoveFailure {
  SessionDemand destination = 1;
  string reason = 2;
  uint64 failed_at_ms = 3;
}

// Selects the runtime currently hosting this player; retries retain that runtime.
message DrainRequest {
  string operation_id = 1;
  string player_id = 2;
  uint32 timeout_seconds = 3;
}

message DrainStatus {
  string operation_id = 1;
  string host_id = 2;
  uint64 deadline_ms = 3;
  uint32 remaining_claims = 4;
  bool stopped = 5;
}

message ClaimIdentity {
  string operation_id = 1;
  string proxy_id = 2;
  uint64 membership_generation = 3;
  uint64 delivery_generation = 4;
}

enum ClaimPhase {
  CLAIM_PHASE_UNSPECIFIED = 0;
  CLAIM_PHASE_RESERVED = 1;
  CLAIM_PHASE_ACTIVATING = 2;
  CLAIM_PHASE_ATTACHED = 3;
  CLAIM_PHASE_ARRIVED = 4;
  CLAIM_PHASE_WITHDRAWING = 5;
  CLAIM_PHASE_RELEASED = 6;
}

message Assignment {
  ClaimIdentity claim = 1;
  ClaimPhase phase = 2;
  PlayerDelivery delivery = 3;
  ConfigurationResponse configuration = 4;
  PlayerPreparation preparation = 5;
}

message ActivateClaim {
  ClaimIdentity claim = 1;
  reserved 2;
  reserved "client_information";
}

message NodesRequest {}
message NodeList {
  repeated NodeStatus nodes = 1;
}
enum NodePhase {
  NODE_PHASE_UNSPECIFIED = 0;
  NODE_PHASE_STARTING = 1;
  NODE_PHASE_ONLINE = 2;
  NODE_PHASE_UNHEALTHY = 3;
  NODE_PHASE_UNREACHABLE = 4;
  NODE_PHASE_DRAINING = 5;
  NODE_PHASE_STOPPING = 6;
  NODE_PHASE_STOPPED = 7;
}
message NodeStatus {
  string host_id = 1;
  string app_id = 2;
  string machine_profile = 3;
  NodePhase phase = 4;
  ProcessHealth health = 5;
  uint64 observed_at_ms = 6;
  uint32 consecutive_failures = 7;
  // The deployment version whose release the node runs.
  string deployment = 8;
}
message PlayersRequest {}
message PlayerList {
  repeated PlayerStatus players = 1;
}
// A player with a current delivery; `demand` is the session that delivery targets.
message PlayerStatus {
  Identity identity = 1;
  SessionDemand demand = 2;
  string host_id = 3;
  string app_id = 4;
  ClaimPhase phase = 5;
  bool moving = 6;
  uint64 since_ms = 7;
  MoveFailure last_move_failure = 8;
}
// Retries bind this operation to the same host and drain deadline.
message ShutdownNodeRequest {
  string operation_id = 1;
  string host_id = 2;
  uint32 timeout_seconds = 3;
}

// Affirmative fencing of the captured membership after connection loss.
message DepartureStatus {
  ClaimIdentity claim = 1;
  bool departed = 2;
}

// Preparation never invokes gameplay. App/session/name are declaration identities, not authority.
message PrepareSessionMethodRequest {
  ClaimIdentity claim = 1;
  string app_id = 2;
  // Unqualified authored session type, e.g. "default" for app "lobby".
  string session = 3;
  string method = 4;
  string arguments_json = 5;
  uint32 timeout_ms = 6;
}

// Opaque control-service handle. Only retained handles can start; recreation is never implicit.
message PreparedMethodHandle {
  string operation_id = 1;
  uint64 deadline_ms = 2;
}

message PreparedMethodRequest {
  string operation_id = 1;
}
