version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  # Services are named for what they are (Runtime, Players, EdgeCall,
  # Directory), and the streaming RPCs reuse message types by design.
  except:
    - SERVICE_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
